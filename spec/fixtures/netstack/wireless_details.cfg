#
sysname WLC-LAB-01
dot1x
dot1x authentication-method eap
#
wlan service-template EAP
 description Laboratory corporate network
 ssid Lab EAP
 vlan 120
 akm mode 802.1X
 dot1x domain lab.example
 cipher-suite ccmp
 security-ie rsn
 service-template enable
#
wlan service-template GUEST
 ssid Lab Guest
 vlan 121
 akm mode psk
 preshared-key pass-phrase cipher SYNTHETIC-PRIVATE-PSK
 undo service-template enable
#
wlan service-template UNKNOWN
 ssid Unconfigured
#
wlan ap-group LAB
 vlan 120
 ap AP-LAB-01
 serial-id LAB-SERIAL-02
 client keep-alive disable
 backup-ac ip 192.0.2.2
 ap-model WA6530
  radio 1
   radio enable
   max-power 20
   service-template EAP vlan 120
  radio 2
   radio disable
   service-template GUEST vlan 121
#
wlan ap-group EMPTY
#
return
